<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=He, initial-scale=1.0">
    <title>Document</title>
    <!-- this is the cdn link which will help to incorporate us to use vuejs onto out app,development version, includes helpful console warnings -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!--We use the div tag and gave it the id as of the name of the vue variable 'el' name-->
    <div id="app">
        <p>You have received {{count}} msgs</p>
        What's your name? <input type="text" v-model="visitor_name" />
        <!--Vue have if else conditions
        v-if,v-else,"v-else-if="-->
        <p v-if="count==0">No replies yet</p>
        <p v-else-if="count>5">You are very popular</p>
        <p v-else>Number of replies {{count}}</p>
        <button v-on:click="sayHi">Say hi</button> <!--We will apply event handlers on this-->
        <ul>
            <li v-for="name in visitors">{{name}}</li>
        </ul>
        <button type="button" class="btn"
        :class="activeclass"
        @click="activeclass=(activeclass==='btn-primary'?'btn-success':'btn-primary')"

        >Change Theme</button>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script type="text/javascript" src="application.js"></script>
</html>
